<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" width="880" height="520" role="img" aria-label="Sample system context diagram">
  <title>SAMPLE — replace with a Structurizr export</title>
  <rect width="880" height="520" fill="#ffffff"/>

  <text x="40" y="52" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#1b2836">System Context — SAMPLE</text>
  <text x="40" y="76" font-family="ui-monospace, monospace" font-size="12" fill="#6b7c8f">scaffolding only · delete this file and its row in watchtower.ts</text>

  <!-- person -->
  <g>
    <circle cx="140" cy="168" r="20" fill="#6b7c8f"/>
    <rect x="96" y="196" width="88" height="56" rx="6" fill="#6b7c8f"/>
    <text x="140" y="222" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#ffffff">Person</text>
    <text x="140" y="240" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#dbe3ea">[Person]</text>
  </g>

  <!-- the system -->
  <g>
    <rect x="360" y="150" width="200" height="120" rx="8" fill="#2f6fb0"/>
    <text x="460" y="196" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#ffffff">Software System</text>
    <text x="460" y="216" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#cfe2f5">[System]</text>
    <text x="460" y="240" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#e6f0fa">The thing being described</text>
  </g>

  <!-- external -->
  <g>
    <rect x="700" y="150" width="140" height="120" rx="8" fill="#8a9bad"/>
    <text x="770" y="200" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#ffffff">External</text>
    <text x="770" y="220" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#e4eaf0">[System]</text>
  </g>

  <!-- store -->
  <g>
    <rect x="360" y="360" width="200" height="90" rx="8" fill="#4a86c4"/>
    <text x="460" y="398" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#ffffff">Data Store</text>
    <text x="460" y="418" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#dbeaf8">[Container]</text>
  </g>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7a8ea3"/>
    </marker>
  </defs>

  <g stroke="#7a8ea3" stroke-width="1.8" fill="none" marker-end="url(#arrow)">
    <path d="M 188 218 L 352 214"/>
    <path d="M 568 210 L 692 210"/>
    <path d="M 460 278 L 460 352"/>
  </g>

  <g font-family="system-ui, sans-serif" font-size="11" fill="#5d7086">
    <text x="268" y="205" text-anchor="middle">Uses</text>
    <text x="630" y="200" text-anchor="middle">Calls</text>
    <text x="472" y="320">Reads / writes</text>
  </g>

  <text x="40" y="492" font-family="ui-monospace, monospace" font-size="11" fill="#8a9bad">Drawn to sit on a light plate, the way a Structurizr SVG export does.</text>
</svg>
