<footer class="foot">
  <div class="wrap inner">
    <div class="col">
      <p class="name">{{ site.brand }}</p>
      <p class="muted small">{{ site.location }}</p>
    </div>

    <nav class="col links" aria-label="Footer">
      <a routerLink="/watchtower">Watchtower</a>
      <a routerLink="/forge">Forge</a>
      <a routerLink="/library">Library</a>
      <a routerLink="/about">The Architect</a>
    </nav>

    <div class="col links">
      <a [href]="site.githubUrl" target="_blank" rel="noopener">GitHub</a>
      <a [href]="site.linkedinUrl" target="_blank" rel="noopener">LinkedIn</a>
      <a [href]="'mailto:' + site.email">Email</a>
    </div>
  </div>

  <div class="wrap bottom">
    <p class="muted small mono">© {{ year }} {{ site.name }} · built with Angular</p>
  </div>
</footer>
