<footer class="foot">
  <div class="wrap inner">
    <div class="col">
      <p class="name">Brandon Lang</p>
      <p class="muted small">{{ site.location }}</p>
    </div>

    <nav class="col links" aria-label="Footer">
      <a routerLink="/writing">Writing</a>
      <a routerLink="/builds">Builds</a>
      <a routerLink="/lab">Lab</a>
      <a routerLink="/about">About</a>
    </nav>

    <div class="col links">
      <a [href]="site.githubUrl" target="_blank" rel="noopener">GitHub</a>
      <a [href]="site.linkedinUrl" target="_blank" rel="noopener">LinkedIn</a>
      <a [href]="'mailto:' + site.email">Email</a>
    </div>
  </div>

  <div class="wrap bottom">
    <p class="muted small mono">© {{ year }} Brandon Lang · built with Angular</p>
  </div>
</footer>
