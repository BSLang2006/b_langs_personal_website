<header class="nav">
  <div class="wrap bar">
    <a class="brand" routerLink="/" (click)="close()">
      <span class="dot" aria-hidden="true"></span>
      <span class="brand-name">B Lang's Citadel</span>
    </a>

    <button
      class="burger"
      type="button"
      [attr.aria-expanded]="open()"
      aria-controls="primary-nav"
      aria-label="Toggle navigation"
      (click)="toggle()"
    >
      <span aria-hidden="true"></span>
      <span aria-hidden="true"></span>
      <span aria-hidden="true"></span>
    </button>

    <nav id="primary-nav" class="links" [class.open]="open()">
      <a class="room-watchtower" routerLink="/watchtower" routerLinkActive="active" (click)="close()">
        <i class="lamp" aria-hidden="true"></i>Watchtower
      </a>
      <a class="room-forge" routerLink="/forge" routerLinkActive="active" (click)="close()">
        <i class="lamp" aria-hidden="true"></i>Forge
      </a>
      <a class="room-library" routerLink="/library" routerLinkActive="active" (click)="close()">
        <i class="lamp" aria-hidden="true"></i>Library
      </a>
      <a class="hall-link" routerLink="/about" routerLinkActive="active" (click)="close()">
        <i class="lamp" aria-hidden="true"></i>The Architect
      </a>
    </nav>
  </div>

  <span class="rail" aria-hidden="true"></span>
</header>
