<!-- SHARED COMPONENT — keep identical across both sites. See presence.ts.
     This is the site footer: the contentinfo landmark, and the only one. -->
<footer class="presence">
  <div class="presence__plate">
    <p class="presence__label mono">On the web</p>
    <p class="presence__attrib mono">© {{ year }} {{ owner }}</p>
  </div>

  <ul class="presence__nodes">
    @for (n of nodes; track n.id) {
      <li class="presence__node" [class.is-here]="n.id === current()">
        @if (n.id === current()) {
          <span class="presence__tag" aria-current="page">
            <span class="presence__mark" aria-hidden="true"></span>
            <span class="presence__text">
              <span class="presence__name">{{ n.name }}</span>
              <span class="presence__kind mono">you are here</span>
            </span>
          </span>
        } @else {
          <a class="presence__tag" [href]="n.href" rel="me noopener">
            <span class="presence__mark" aria-hidden="true"></span>
            <span class="presence__text">
              <span class="presence__name">{{ n.name }}</span>
              <span class="presence__kind mono">{{ n.kind }}</span>
            </span>
            <span class="presence__claim">{{ n.claim }}</span>
          </a>
        }
      </li>
    }
  </ul>

  <!-- Deliberately outside the four. It is a way to reach me, not a place I
       keep work, and the four-corner idea only reads if it stays four. -->
  <a class="presence__contact" [href]="'mailto:' + email">
    <span class="presence__contact-icon" aria-hidden="true">✉</span>
    <span class="presence__contact-text">
      <span class="presence__contact-label mono">Email</span>
      <span class="presence__contact-value">{{ email }}</span>
    </span>
  </a>
</footer>
