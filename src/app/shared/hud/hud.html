<section class="panel" aria-label="Skills instrument panel">
  <span class="rail" aria-hidden="true"></span>

  <div class="strip">
    <span class="id mono">BSL-01 · OPERATOR PANEL</span>
    <span class="sep" aria-hidden="true"></span>
    <span class="loc mono">WPB · FL</span>
    <span class="live mono"><i aria-hidden="true"></i>NOMINAL</span>
  </div>

  <div class="gauges">
    @for (g of gauges; track g.label) {
      <figure class="gauge" [class]="g.tone">
        <svg viewBox="0 0 120 120" role="img" [attr.aria-label]="g.label + ': ' + g.value + ' of 100'">
          <circle class="track" cx="60" cy="60" r="52" />
          <circle
            class="arc"
            cx="60"
            cy="60"
            r="52"
            [style.--dash]="circumference"
            [style.--offset]="offset(g.value)"
          />
        </svg>
        <figcaption>
          <span class="num mono">{{ g.value }}</span>
          <span class="lbl">{{ g.label }}</span>
          <span class="det mono">{{ g.detail }}</span>
        </figcaption>
      </figure>
    }
  </div>

  <div class="trace" aria-hidden="true">
    <svg viewBox="0 0 600 60" preserveAspectRatio="none">
      <polyline
        points="0,30 40,30 55,12 70,48 85,30 130,30 150,22 170,38 190,30 260,30 275,8
                290,52 305,30 360,30 380,24 400,36 420,30 490,30 505,14 520,46 535,30 600,30"
      />
    </svg>
  </div>

  <ul class="readouts">
    @for (r of readouts; track r.label) {
      <li class="mono" [class]="r.state">
        <i aria-hidden="true"></i>{{ r.label }}
      </li>
    }
  </ul>

  <p class="disclaimer mono">
    static readout · live home-lab telemetry planned
  </p>
</section>
